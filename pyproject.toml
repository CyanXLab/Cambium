[project]
name = "cambium"
version = "2.0.0"
description = "Cambium — The Continuity Engine for Personal AI"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "CyanXLab"}]
readme = "README.md"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "httpx>=0.27.0",
    "jinja2>=3.1.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
]

[project.optional-dependencies]
vector = ["chromadb>=0.5.0"]
mcp = ["mcp>=0.9.0"]
langgraph = ["langchain>=1.0.0", "langchain-core>=1.0.0", "langgraph>=1.0.0"]
dspy = ["dspy>=3.0.0"]
autogen = ["autogen-agentchat>=0.7.0", "autogen-ext>=0.7.0"]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.0.0",
    "respx>=0.20.0",
]
all = [
    "chromadb>=0.5.0",
    "mcp>=0.9.0",
    "langchain>=1.0.0",
    "langchain-core>=1.0.0",
    "langgraph>=1.0.0",
    "dspy>=3.0.0",
    "autogen-agentchat>=0.7.0",
    "autogen-ext>=0.7.0",
]

[project.scripts]
cambium = "app.main:run"

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["workspace*", "custom_tools*", "plugins*", "tests*", "docs*", "scripts*"]

[tool.setuptools.package-data]
app = ["templates/*.html", "static/**/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4"]
ignore = ["E501", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
"app/main.py" = ["F401", "F841"]  # Legacy file — clean up incrementally

[tool.mypy]
python_version = "3.11"
warn_return_any = false
warn_unused_configs = true
ignore_missing_imports = true
