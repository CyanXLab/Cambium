[project]
name = "cambium"
version = "1.3.0"
description = "Cambium — The Continuity Engine for Personal AI"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "httpx>=0.27.0",
    "jinja2>=3.1.0",
    "pydantic>=2.0.0",
    "langchain>=1.0.0",
    "langchain-core>=1.0.0",
    "langgraph>=1.0.0",
    "dspy>=3.0.0",
]

[project.optional-dependencies]
vector = ["chromadb>=0.5.0"]
mcp = ["mcp>=0.9.0"]
dev = ["pytest>=8.0.0", "pytest-asyncio>=0.23.0"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
